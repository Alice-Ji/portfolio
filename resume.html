<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <title>Alice Ji – Portfolio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="https://alice-ji.github.io/portfolio/assets/favicon.png"
      type="image/png"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html">
        <img
          src="https://alice-ji.github.io/portfolio/assets/favicon.png"
          style="width: 24px; height: 24px;"
        />
      </a>
      <a href="index.html" class="nav-link">Home</a>
      <a href="resume.html" class="nav-link active">Resume</a>
      <button id="dark-toggle" class="dark-toggle">🌒 Dark Mode</button>
    </nav>

    <main>
        <iframe
        src="https://drive.google.com/file/d/16JrM4NhQivu2N5WZsSyd5xdcJwUhgvrTPZXnghZ4YQI/preview"
        width="100%"
        height="400"
        style="border: 1.5px solid #e5e8ee; border-radius: 10px"
        allow="autoplay"
      >
      </iframe>
      <p style="text-align: center; margin: 18px 0 24px 0">
        <a
            href="https://docs.google.com/document/d/16JrM4NhQivu2N5WZsSyd5xdcJwUhgvrTPZXnghZ4YQI/export?format=pdf"
          target="_blank"
          rel="noopener"
          style="
            display: inline-block;
            background: #2453aa;
            color: #fff;
            padding: 7px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
          "
        >
          Download Resume
        </a>
    </main>
    <footer>&copy; 2026 Alice Ji</footer>
    <script>
      const btn = document.getElementById("dark-toggle");
      // On load, restore state
      if (localStorage.getItem("dark-mode") === "true") {
        document.body.classList.add("dark-mode");
        btn.textContent = "☀️ Light Mode";
      }
      // Toggle and save state
      btn.onclick = () => {
        document.body.classList.toggle("dark-mode");
        const enabled = document.body.classList.contains("dark-mode");
        btn.textContent = enabled ? "☀️ Light Mode" : "🌒 Dark Mode";
        localStorage.setItem("dark-mode", enabled);
      };

      // motion
      const observer = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        },
        {
          threshold: 0.15
        }
      );

      document.querySelectorAll('.reveal').forEach(el => {
        observer.observe(el);
      });

      // save scroll position before clicking into a case study
      document.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          sessionStorage.setItem("scrollPos", window.scrollY);
        });
      });
      // restore scroll position on portfolio page
      const scrollPos = sessionStorage.getItem("scrollPos");
      if (scrollPos) {
        window.scrollTo({ top: parseInt(scrollPos), behavior: "smooth" });
        sessionStorage.removeItem("scrollPos"); // Clear so it doesn't trigger again later
      }
</script>

    </script>
  </body>
</html>
